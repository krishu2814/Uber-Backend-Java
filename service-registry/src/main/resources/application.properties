# Standard port for Netflix Eureka Service Registry
server.port=8761

# Application name identifier
spring.application.name=service-registry

# Since this is the registry server itself, it should not register with itself
eureka.client.register-with-eureka=false

# It should not try to fetch registry copies from anywhere else
eureka.client.fetch-registry=false

# URL endpoint for other microservices to register with this server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
